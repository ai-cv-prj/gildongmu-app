<!--
file_path: frontend/index.html

휴대폰 카메라에서 보행 위험과 신호등을 한 화면으로 테스트한다.
-->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a2a">
  <title>길동무 실시간 테스트</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <span class="eyebrow">GILDONGMU · MOBILE TEST</span>
      <h1>보행 + 신호등</h1>
      <p>휴대폰 카메라를 PC 서버로 보내 같은 장면의 보행 위험과 보행자 신호를 확인합니다.</p>
    </header>

    <section class="panel settings" aria-label="테스트 설정">
      <label for="device">휴대폰 기종</label>
      <select id="device">
        <option value="Galaxy S24+">Galaxy S24+</option>
        <option value="Galaxy S25 Ultra">Galaxy S25 Ultra</option>
        <option value="Galaxy Quantum 3">Galaxy Quantum 3</option>
        <option value="iPhone 15 Pro">iPhone 15 Pro</option>
        <option value="custom">직접 입력</option>
      </select>
      <input id="custom-device" type="text" maxlength="80" placeholder="휴대폰 기종 입력" hidden>
      <label for="note">테스트 메모 <span class="muted">선택</span></label>
      <input id="note" type="text" maxlength="500" placeholder="예: 금촌역 횡단보도">
      <label class="check"><input id="record" type="checkbox"> 오버레이와 안내 음성 영상도 저장</label>
      <span class="muted">원본 카메라 영상은 항상 저장됩니다.</span>
    </section>

    <section class="camera-panel" aria-label="카메라와 추론 결과">
      <div class="camera" id="camera">
        <video id="video" autoplay playsinline muted aria-label="후면 카메라 영상"></video>
        <canvas id="overlay" aria-hidden="true"></canvas>
        <div class="camera-placeholder" id="placeholder">카메라를 켜면 영상이 여기에 표시됩니다.</div>
        <div class="camera-badge" id="camera-badge">대기 중</div>
      </div>
      <div class="legend" aria-label="화면 색상 안내">
        <div class="legend-row"><span class="walkable">보행가능영역</span><span class="crosswalk">횡단보도</span></div>
        <div class="legend-row risk-levels"><strong>장애물 테두리</strong><span class="monitor">관찰</span><span class="caution">주의</span><span class="danger">위험</span></div>
      </div>
    </section>

    <section class="controls" aria-label="테스트 제어">
      <button id="camera-button" type="button" class="secondary">카메라 켜기</button>
      <button id="test-button" type="button" class="primary" disabled>테스트 시작</button>
    </section>

    <section class="panel status-panel" aria-live="polite">
      <div class="status-heading"><h2>상태</h2><span id="metrics">0 프레임</span></div>
      <p id="status">서버와 카메라를 준비해 주세요.</p>
    </section>
    <p class="footnote">화면을 켠 상태에서 사용하세요. 카메라 접근에는 HTTPS가 필요합니다. 추론 결과만으로 횡단·이동 안전을 판단하지 마세요.</p>
  </main>
  <script defer src="/static/js/camera.js"></script>
  <script defer src="/static/js/tts.js"></script>
  <script defer src="/static/js/guidance.js"></script>
  <script defer src="/static/js/overlay.js"></script>
  <script defer src="/static/js/recorder.js"></script>
  <script defer src="/static/js/api.js"></script>
  <script defer src="/static/js/app.js"></script>
</body>
</html>
