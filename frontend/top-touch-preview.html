<style>
#gdm-top-touch {--gm-yellow:#FFD21C;--gm-soft:#FFF9E3;--gm-ink:#111111;--gm-charcoal:#2A2622;--gm-action-text:#FFF9E7;--gm-dash:#A67600;--gm-line:#E6D9A8;--gm-shadow:0 10px 22px rgba(120,90,0,.14);--gm-button-shadow:0 1px 2px rgba(120,90,0,.10),0 8px 18px rgba(120,90,0,.12);--gm-key-shadow:0 1px 2px rgba(120,90,0,.10),0 4px 10px rgba(120,90,0,.10);--gm-dark-shadow:inset 0 1px 0 rgba(255,249,231,.14),0 10px 20px rgba(51,40,0,.20);--gm-sheet-shadow:0 -6px 18px rgba(120,90,0,.08);color-scheme:light;font-family:"Pretendard","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
#gdm-top-touch * {box-sizing:border-box;}
#gdm-top-touch [hidden] {display:none!important;}
#gdm-top-touch button,#gdm-top-touch input,#gdm-top-touch select {font:inherit;touch-action:manipulation;}
#gdm-top-touch button {margin:0;border:0;line-height:1.3;font-weight:750;word-break:keep-all;overflow-wrap:anywhere;box-shadow:var(--gm-button-shadow);}
#gdm-top-touch button span {color:inherit;}
#gdm-top-touch h1,#gdm-top-touch h2,#gdm-top-touch p {margin:0;color:inherit;word-break:keep-all;overflow-wrap:anywhere;}
#gdm-top-touch .gm-review {display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px;color:light-dark(#101010,#FFFFFF);}
#gdm-top-touch .gm-review label {font-size:17px;font-weight:750;}
#gdm-top-touch .gm-review select {background:light-dark(#F5F3E9,#333333);color:light-dark(#101010,#FFFFFF);padding:11px 14px;border:0;border-radius:12px;font-size:16px;min-height:44px;}
#gdm-top-touch .gm-preview {display:flex;justify-content:center;padding:22px 0 28px;}
#gdm-top-touch .gm-device {--gm-scale:1;width:390px;max-width:calc(100% - 12px);border:3px solid #292929;border-radius:36px;overflow:hidden;background:var(--gm-soft);color:var(--gm-ink);box-shadow:0 12px 32px #33280012;font-size:calc(24px * var(--gm-scale));line-height:1.4;}
#gdm-top-touch .gm-statusbar {height:40px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;position:relative;font-size:12px;font-weight:800;background:var(--gm-soft);}
#gdm-top-touch .gm-statusbar::after {content:"";position:absolute;left:50%;top:7px;transform:translateX(-50%);width:76px;height:19px;border-radius:14px;background:#101010;}
#gdm-top-touch .gm-statusbar span:last-child {display:flex;gap:5px;}
#gdm-top-touch .gm-statusbar svg {width:15px!important;height:15px!important;}
#gdm-top-touch .gm-homebar {height:22px;display:flex;justify-content:center;align-items:center;background:var(--gm-soft);}
#gdm-top-touch .gm-homebar::before {content:"";width:104px;height:4px;border-radius:4px;background:#101010;}
#gdm-top-touch .gm-body {height:736px;position:relative;display:flex;flex-direction:column;}
#gdm-top-touch .gm-panel {height:100%;min-height:0;display:flex;flex-direction:column;background:var(--gm-yellow);}
#gdm-top-touch .gm-controls {flex:none;padding:24px;background:var(--gm-yellow);}
#gdm-top-touch .gm-primary-controls {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;}
#gdm-top-touch .gm-touch-zone {min-height:112px;min-width:0;padding:14px 10px;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,calc(28px * var(--gm-scale)),32px);letter-spacing:-.035em;text-align:center;border:1.5px solid #E6D9A8;border-radius:24px;background:#FFFDF4;color:var(--gm-ink);box-shadow:var(--gm-button-shadow);}
#gdm-top-touch .gm-touch-zone span {color:inherit;display:block;}
#gdm-top-touch .gm-touch-zone.gm-top-primary {background:var(--gm-charcoal);color:var(--gm-action-text);border-color:var(--gm-charcoal);box-shadow:var(--gm-dark-shadow);}
#gdm-top-touch .gm-story-controls {display:flex;justify-content:center;padding:20px 24px 24px;background:var(--gm-soft);}
#gdm-top-touch .gm-story-action {width:100%;min-height:108px;font-size:clamp(28px,calc(28px * var(--gm-scale)),36px);background:var(--gm-charcoal);color:var(--gm-action-text);border-color:var(--gm-charcoal);gap:12px;box-shadow:var(--gm-dark-shadow);}

  const chars=letterGroup==='english'?[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ']:routes[letterGroup];
  const pages=Math.ceil(chars.length/9);letterPage%=pages;
  const grid=q('#gm-letter-keys');grid.replaceChildren();
  for(let i=0;i<9;i++){
   const char=chars[letterPage*9+i];
   if(char)grid.append(letterButton(char,'letter',char));
   else{const spacer=document.createElement('div');spacer.className='gm-key-spacer';spacer.setAttribute('aria-hidden','true');grid.append(spacer);}
  }
  grid.append(letterButton('숫자','letterAction','numbers',true),letterButton('다음','letterAction','page',true),letterButton('삭제','letterAction','delete',true));
 }
 function syncDraft(){draft=letterPrefix()+prefixDigits;renderNumber();}
 function renderKeypad(){
  q('#gm-keypad-layer').hidden=!keypadOpen;
  q('#gm-route-input').setAttribute('aria-expanded',String(keypadOpen));
  qa('[data-panel]').forEach(panel=>panel.inert=keypadOpen);q('#gm-preview-screen').disabled=keypadOpen;
  q('#gm-number-keys').hidden=keypadMode!=='numbers';q('#gm-letter-keys').hidden=keypadMode!=='letters';q('.gm-letter-modes').hidden=keypadMode!=='letters';
  if(keypadMode==='letters')renderLetters();
  q('#gm-keypad-dialog').setAttribute('aria-label',keypadMode==='numbers'?'버스 번호 숫자 입력 팝업':'버스 번호 한글 영문 입력 팝업');
  q('#gm-preview-screen').value=keypadOpen?(keypadMode==='numbers'?'keypad':'prefix'):scene;
 }
 function openKeypad(mode='numbers'){
  if(scene!=='input')return;stopRecognition();
  const parts=draft.match(/^([A-Z가-힣ㄱ-ㅎㅏ-ㅣ]*)([0-9-]*)$/i);prefixBuffer=parts?parts[1]:'';prefixDigits=parts?parts[2]:'';
  letterGroup=/^[A-Z]+$/i.test(prefixBuffer)?'english':'consonants';letterPage=0;keypadMode=mode;keypadOpen=true;
  renderNumber();renderKeypad();q('[data-action="close-keypad"]').focus();
 }
 function closeKeypad(restore=true){
  keypadOpen=false;renderKeypad();
  if(restore&&scene==='input')q('#gm-route-input').focus();
 }
 function render(){
  if(scene!=='home')stopRatePreview();
  q('#gm-app').dataset.scene=scene;q('#gm-preview-screen').value=scene;
  qa('[data-panel]').forEach(el=>el.hidden=el.dataset.panel!==(definitions[scene]?'active':scene));
  film.setVisible(scene==='welcome');
  renderKeypad();
  const d=definitions[scene];if(!d){icons();return;}
  q('[data-panel="active"]').setAttribute('aria-label',d.name);
  for(const side of ['left','right']){
   const [label,action]=d[side],button=q('#gm-'+side);q('#gm-'+side+'-label').textContent=label;
   button.dataset.action=action;button.setAttribute('aria-label',label);
  }
  const aux=q('#gm-auxiliary');aux.hidden=!d.aux;aux.removeAttribute('aria-pressed');aux.removeAttribute('aria-label');
  const voice=scene==='input';aux.classList.toggle('gm-voice-button',voice);q('#gm-mic-mark').hidden=!voice;
  if(d.aux){q('#gm-aux-label').textContent=d.aux[0];aux.dataset.action=d.aux[1];}
  if(voice)setMic(false);
  const title=q('#gm-title');title.hidden=scene==='input';
  if(scene==='bus'){
   const number=document.createElement('span');number.className='gm-route-emphasis';number.dataset.long=String(route.length>5);number.textContent=route+'번';
   title.replaceChildren(number,document.createTextNode(' 버스 인식 중'));
  }else setLines(title,d.title||'');
  title.classList.toggle('gm-bus-title',scene==='bus');
  q('#gm-number-editor').hidden=scene!=='input';renderNumber();
  q('#gm-camera-sample').hidden=!d.camera;icons();
 }
 function navigate(next){
  if(!supported.includes(next))return;
  stopRecognition();stopRatePreview();closeKeypad(false);if(next==='welcome')film.restart();
  scene=next;render();announce();
 }
 function commitRoute(value){
  const parsed=routes.normalize(value);
  if(!parsed){inputError('번호 다시 입력');return false;}
  route=draft=parsed;navigate('bus');return true;
 }
 function voiceInput(){
  if(recognition){stopRecognition();return;}
  const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Speech){inputError('음성 입력 불가');return;}
  stopRecognition();stopRatePreview();try{speechSynthesis.cancel();}catch{}
  const run=recognitionRun;let gotResult=false;
  try{
   const r=new Speech();recognition=r;r.lang='ko-KR';r.continuous=false;r.interimResults=false;r.maxAlternatives=1;
   r.onstart=()=>{if(run===recognitionRun&&scene==='input')setMic(true);};
   r.onresult=event=>{
    if(run!==recognitionRun||scene!=='input')return;
    const result=event.results[event.resultIndex||0];if(!result||!result.isFinal)return;
    gotResult=true;const parsed=routes.normalize(result[0].transcript);stopRecognition();
    if(!parsed){inputError('번호 다시 입력');return;}
    commitRoute(parsed);
   };
   r.onerror=event=>{if(run!==recognitionRun)return;stopRecognition();inputError(event.error==='not-allowed'?'마이크 허용 필요':'다시 말해 주세요');};
   r.onend=()=>{if(run!==recognitionRun)return;recognition=null;setMic(false);if(!gotResult&&scene==='input')inputError('다시 말해 주세요');};
   setMic(true);r.start();
  }catch{stopRecognition();inputError('음성 입력 불가');}
 }
 function act(action){
  if(performance.now()-lastAction<250)return;lastAction=performance.now();
  if(action==='repeat'){announce();return;}
  if(action==='end-guidance'){navigate('welcome');speak('안내 종료');return;}
  if(action==='mic-input'){voiceInput();return;}
  if(action==='open-keypad'){openKeypad();return;}
  if(action==='close-keypad'){closeKeypad();return;}
  if(action==='keypad-search'){commitRoute(draft);return;}
  if(scene==='input'&&action==='bus'){commitRoute(draft);return;}
  if(action==='end')beforeEnd=scene;
  navigate(action==='cancel-end'?beforeEnd:action);
 }
 qa('[data-action]').forEach(button=>button.addEventListener('click',()=>act(button.dataset.action)));
 qa('[data-key]').forEach(button=>button.addEventListener('click',()=>{
  if(scene!=='input'||!keypadOpen)return;const key=button.dataset.key;
  if(key==='letters'){keypadMode='letters';renderKeypad();return;}
  if(key==='delete'){
   if(prefixDigits)prefixDigits=prefixDigits.slice(0,-1);else prefixBuffer=[...prefixBuffer].slice(0,-1).join('');
   syncDraft();speak(draft?spokenRoute(draft):'입력 없음');return;
  }
  if(prefixDigits.replace(/\D/g,'').length>=4){speak('숫자 네 자리까지');return;}
  prefixDigits+=key;syncDraft();speak(spokenRoute(key));
 }));
 qa('[data-letter-group]').forEach(button=>button.addEventListener('click',()=>{letterGroup=button.dataset.letterGroup;letterPage=0;renderLetters();speak(button.textContent);}));
 q('#gm-letter-keys').addEventListener('click',event=>{
  const button=event.target.closest('button');if(!button||!keypadOpen||keypadMode!=='letters')return;
  if(button.dataset.letter){
   const next=prefixBuffer+button.dataset.letter;if(routes.composeHangul(next).length>8){speak('입력 길이 초과');return;}
   prefixBuffer=next;
  }else if(button.dataset.letterAction==='delete')prefixBuffer=[...prefixBuffer].slice(0,-1).join('');
  else if(button.dataset.letterAction==='page')letterPage++;
  else if(button.dataset.letterAction==='numbers')keypadMode='numbers';
  syncDraft();renderKeypad();speak(button.dataset.letter||button.textContent);
 });
 qa('[data-rate]').forEach(button=>button.addEventListener('click',()=>{
  rate=Number(button.dataset.rate);qa('[data-rate]').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));
  stopRatePreview();previewTimer=setTimeout(previewRate,220);q('#gm-announcer').textContent=rate+'배';
 }));
 qa('[data-size]').forEach(button=>button.addEventListener('click',()=>{
  q('#gm-app').style.setProperty('--gm-scale',button.dataset.size);qa('[data-size]').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));speak('글자 크기, '+button.textContent.trim());
 }));
 q('#gm-preview-screen').addEventListener('change',e=>{
  const next=e.target.value;closeKeypad(false);stopRecognition();stopRatePreview();lastAction=-Infinity;
  scene=next==='keypad'||next==='prefix'?'input':next;render();
  if(next==='keypad'||next==='prefix')openKeypad(next==='keypad'?'numbers':'letters');
 });
 root.addEventListener('keydown',event=>{
  if(!keypadOpen)return;
  if(event.key==='Escape'){event.preventDefault();closeKeypad();return;}
  if(event.key==='Tab'){
   const buttons=[...q('#gm-keypad-dialog').querySelectorAll('button')].filter(el=>el.getBoundingClientRect().width>0&&!el.disabled);
   const first=buttons[0],last=buttons.at(-1);
   if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
   else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
 });
 window.addEventListener('pagehide',()=>{stopRecognition();stopRatePreview();});
 document.addEventListener('visibilitychange',()=>{if(document.hidden){stopRecognition();stopRatePreview();}});
 render();
 if(initial==='keypad'||initial==='prefix')openKeypad(initial==='keypad'?'numbers':'letters');
})();
</script><script>/* 길동무 디자인 다듬기 · 화면별 그림
 * 버스 번호 입력: 오프닝 애니메이션의 "143 말하기" 장면을 정지 그림으로 표시합니다(GildongmuFilm.draw 호출만 사용).
 * 종료 확인: 같은 인물·버스 일러스트로 "버스에서 내려 다시 걷는" 9초 반복 애니메이션을 그립니다.
 * 기존 오프닝 애니메이션 코드와 앱 동작 코드는 수정하지 않습니다.
 */
(() => {
  'use strict';
  const root = document.getElementById('gdm-top-touch');
  const app = root && root.querySelector('#gm-app');
  const A = globalThis.GildongmuFilmAssets, Film = globalThis.GildongmuFilm;
  const endCanvas = root && root.querySelector('#gm-end-film');
  const inputCanvas = root && root.querySelector('#gm-input-art');
  if (!app || !A || !endCanvas || !inputCanvas) return;

  const INK = '#242424', STROKE = 2.2, LOOP = 9, STILL = 1.6;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const mix = (a, b, p) => a + (b - a) * p;
  const span = (t, a, b) => clamp((t - a) / (b - a));
  const ease = n => { n = clamp(n); return n * n * (3 - 2 * n); };
  const paths = new WeakMap();

  function penFrame(c, f, x, y, scale) {
    let p = paths.get(f);
    if (!p) { p = { fill: new Path2D(f.fill), pen: new Path2D(f.pen) }; paths.set(f, p); }
    c.save(); c.translate(x, y); c.scale(scale, scale);
    c.fillStyle = '#FFFFFF'; c.fill(p.fill);
    c.strokeStyle = INK; c.lineWidth = STROKE / scale; c.lineCap = 'round'; c.lineJoin = 'round';
    c.stroke(p.pen); c.restore();
  }
  function actor(c, frame, headX, feet, height, alpha = 1) {
    const f = A.hero.frames[frame], scale = height / f.sh;
    c.save(); c.globalAlpha *= alpha;
    penFrame(c, f, headX - f.anchor * scale, feet - height, scale);
    c.restore();
  }
  function drawBus(c, x, floor, width, open) {
    const f = A.bus.frames[open ? 1 : 0], height = width * f.sh / f.sw;
    penFrame(c, f, x, floor - height, width / f.sw);
  }
  function ground(c) {
    c.save(); c.strokeStyle = '#8E8038'; c.lineWidth = STROKE; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-70, 398); c.lineTo(670, 398); c.stroke(); c.restore();
  }

  // 0~0.5초 정차 → 0.5~1.4초 하차 → 2.2초 문 닫힘 → 2.6~5.2초 버스 출발 → 인물은 오른쪽으로 계속 걷기
  function exitScene(c, t) {
    ground(c);
    const bx = t < 2.6 ? 40 : mix(40, -1000, ease(span(t, 2.6, 5.2)));
    drawBus(c, bx, 397, 900, t < 2.2);
    if (t < 0.5) return;
    if (t < 1.4) {
      const p = ease(span(t, 0.5, 1.4));
      actor(c, t < 1.0 ? 11 : Math.floor(t * 9) % 8, mix(205, 240, p), mix(352, 394, p), mix(184, 260, p), ease(span(t, 0.5, 0.8)));
      return;
    }
    actor(c, Math.floor(t * 9) % 8, mix(240, 560, span(t, 1.4, 8.6)), 394, 260);
  }

  function fit(canvas) {
    const r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    const d = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(r.width * d), h = Math.round(r.height * d);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    return [w, h];
  }
  function paintEnd(t) {
    const size = fit(endCanvas); if (!size) return;
    const [w, h] = size, c = endCanvas.getContext('2d'), ratio = Math.min(w / 600, h / 455);
    c.save(); c.clearRect(0, 0, w, h);
    c.translate((w - ratio * 600) / 2, h - ratio * 455); c.scale(ratio, ratio);
    c.globalAlpha = Math.min(ease(span(t, 0, .3)), 1 - ease(span(t, LOOP - .4, LOOP)));
    exitScene(c, t); c.restore();
  }
  function paintInput() {
    if (!Film || typeof Film.draw !== 'function') return;
    const size = fit(inputCanvas); if (!size) return;
    Film.draw(inputCanvas.getContext('2d'), 16.5, size[0], size[1]);
  }

  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let raf = 0, start = 0;
  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; start = 0; }
  function tick(now) {
    raf = 0;
    if (app.dataset.scene !== 'end' || document.hidden || motion.matches) return;
    if (!start) start = now;
    paintEnd(((now - start) / 1000) % LOOP);
    raf = requestAnimationFrame(tick);
  }
  function sync() {
    const scene = app.dataset.scene;
    if (scene === 'end' && !document.hidden) {
      if (motion.matches) { stop(); paintEnd(STILL); }
      else if (!raf) raf = requestAnimationFrame(tick);
    } else stop();
    if (scene === 'input') paintInput();
  }
  new MutationObserver(sync).observe(app, { attributes: true, attributeFilter: ['data-scene'] });
  new ResizeObserver(() => {
    if (app.dataset.scene === 'input') paintInput();
    if (app.dataset.scene === 'end' && motion.matches) paintEnd(STILL);
  }).observe(inputCanvas.parentElement);
  document.addEventListener('visibilitychange', sync);
  motion.addEventListener('change', sync);
  sync();
})();
</script></div>
