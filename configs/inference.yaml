# file_path: configs/inference.yaml
# 보도·장애물·신호등 통합 추론 설정. 

paths_config: configs/paths.yaml

# 공통 실행 설정
device: auto
mode: all # all: 전체, both: 도보+장애물, 나머지: 단독
overlay_alpha: 0.55 # 마스크 투명도

# 녹화 영상도 휴대폰 실시간 전송 프레임과 같은 크기·JPEG 품질로 추론한다.
recorded_frame:
  max_side: 640
  jpeg_quality: 0.72

# 장애물 YOLO
yolo:
  conf: 0.25
  imgsz: 640
  head: nms # NMS 후처리 사용
  iou: 0.7
  max_det: 300
  rect: true

# 신호등·횡단보도 추론
traffic:
  conf: 0.25
  imgsz: 640
  crosswalk_min_confidence: 0.50
  classifier_min_confidence: 0.60
  association_stable_frames: 3
  # 가장 또렷한 신호등 신뢰도의 70%보다 흐린 검출은 대상 선택에서만 뺀다(화면 표시는 유지).
  selection_relative_confidence: 0.7

# 화면 크기·위치와 시간 구간의 관측으로 근접을 추정한다. 실제 거리·충돌 안전이 아니다.
stop_proximity:
  min_box_height: 0.20
  min_box_width: 0.05
  min_box_bottom: 0.60
  # 박스 중심이 좌우 25% 영역에 있고 더 큰 박스가 화면 중간 높이까지 내려와야 한다.
  side_center_limit: 0.25
  side_min_box_height: 0.30
  side_min_box_width: 0.08
  side_min_box_bottom: 0.45
  confirm_frames: 3
  confirm_s: 1.20
  confirm_window_s: 2.0
  candidate_hold_s: 1.0
  nearby_hold_s: 3.0
  min_confidence: 0.30
  match_iou: 0.10
  max_gap_s: 2.0

# 횡단보도 안전 안내
# 좌표와 여유값은 영상 너비·높이 기준 비율이다.
crosswalk_safety:
  enabled: true

  # 사용자 위치
  near_zone_top: 0.72
  foot_x: 0.50
  foot_y: 0.92
  foot_half_width: 0.04
  foot_half_height: 0.04

  # 화면 하단 확인 영역
  roi_left: 0.10
  roi_right: 0.90
  roi_top: 0.90
  roi_bottom: 1.00
  roi_crosswalk_threshold: 0.05
  roi_occlusion_threshold: 0.08

  # 횡단 중 보라색 ROI가 사라졌을 때 확인할 분홍색 즉시위험 ROI
  exit_roi_left: 0.02
  exit_roi_right: 0.98
  exit_roi_top: 0.70
  exit_roi_bottom: 1.00
  exit_roi_crosswalk_threshold: 0.05

  # 상태 확정 시간(초)
  entry_confirm_s: 0.50
  geometry_entry_confirm_s: 0.30
  entry_occlusion_hold_s: 0.50
  edge_confirm_s: 0.20
  exit_confirm_s: 0.25
  exit_candidate_hold_s: 0.50
  return_confirm_s: 0.40
  finish_confirm_s: 0.40
  outside_finish_confirm_s: 0.80
  uncertainty_hold_s: 1.50
  max_gap_s: 2.00

  # 경계 판정과 안정화
  edge_margin: 0.08
  exit_margin: 0.03
  max_boundary_shift: 0.12
  boundary_hold_s: 0.50
  boundary_candidate_confirm_s: 0.30
  boundary_smooth_s: 0.30

  # 마스크 유효 기준
  min_mask_area: 0.006
  min_row_width: 0.10
  min_valid_rows: 8
  finish_walkable_fraction: 0.60
  outside_finish_walkable_fraction: 0.80

  # 빨간불·신호 미확인 중 횡단보도 장애물 음성 억제
  non_green_obstacle_voice_suppression: true
  non_green_obstacle_crosswalk_threshold: 0.20
  non_green_obstacle_crosswalk_contact_half_height: 0.02

  # 신호와 관계없이 bbox 좌·우·아래 바깥 띠의 통합 보행가능 비율로 음성 억제
  obstacle_surrounding_voice_suppression: true
  obstacle_surrounding_walkable_threshold: 0.30
  obstacle_surrounding_partial_walkable_threshold: 0.05
  obstacle_surrounding_side_width_ratio: 0.15
  obstacle_surrounding_side_height_ratio: 0.20
  obstacle_surrounding_bottom_height_ratio: 0.10
  obstacle_surrounding_max_side_width_ratio: 0.02
  obstacle_surrounding_max_bottom_height_ratio: 0.02
  obstacle_surrounding_min_region_pixels: 4

  # 좌우 이동 음성은 핑크 ROI의 해당 끝 30%에서 보행 마스크가 30% 이상일 때 유지한다.
  walking_direction_edge_width_ratio: 0.30
  walking_direction_min_walkable_ratio: 0.30

# 보행로 이탈 안내
# 횡단보도 판정과 같은 가상 발 영역을 사용하되 상태와 음성은 따로 관리한다.
walking_surface:
  enabled: true
  foot_x: 0.50
  foot_y: 0.92
  foot_half_width: 0.04
  foot_half_height: 0.04
  exit_fraction: 0.50
  inside_fraction: 0.60
  exit_confirm_s: 0.60
  return_confirm_s: 0.50
  max_gap_s: 2.00
  stale_after_s: 1.50
  min_component_fraction: 0.003
  direction_deadband: 0.01

# 장애물 위험 판단
# 좌표는 정규화된 영상 좌표이며 실제 거리 단위가 아니다.
# 객체 검출은 전체 화면을 사용한다.
risk:
  enabled: true

  # 기본 예상보행경로(ROI)
  corridor_polygon:
    - [0.38, 0.30]
    - [0.62, 0.30]
    - [0.98, 0.65]
    - [0.98, 1.00]
    - [0.02, 1.00]
    - [0.02, 0.65]
  immediate_polygon:
    - [0.02, 0.65]
    - [0.98, 0.65]
    - [0.98, 1.00]
    - [0.02, 1.00]

  # 객체 바닥과 정적 장애물 근접 기준
  footprint_height_ratio: 0.15
  footprint_max_height: 0.02
  exit_overlap_threshold: 0.1
  exit_margin: 0.02
  static_caution_y: 0.55
  static_danger_y: 0.78
  static_ground_classes:
    - pole
    - bollard
    - tree_trunk
    - potted_plant
    - fire_hydrant
    - utility_box
    - parking_meter
    - kiosk
    - bench
    - barricade
    - trash_bin

  # 보행가능영역 기반 ROI 보정
  sidewalk_roi_enabled: true
  roi_max_shift: 0.15
  roi_fit_residual: 0.04
  roi_confirm_s: 0.2
  roi_smooth_s: 0.3
  roi_max_shift_per_s: 0.12
  roi_hold_s: 0.5
  roi_return_s: 0.5
  clear_confirm_s: 0.5
  uncertainty_hold_s: 0.8

  # 객체 ID 연결과 경로 진입 예측
  id_bridge_s: 0.3
  id_bridge_iou: 0.5
  overlap_threshold: 0.2
  edge_margin_ratio: 0.08
  history_window_s: 0.6
  min_history_s: 0.2
  prediction_horizon_s: 0.8
  # 안정적인 추적에서 장애물이 근접 경로에 들어올 때를 미리 위험으로 판단
  approach_danger_enabled: true
  approach_danger_s: 0.5
  # 차량·자전거만: 안정된 추적에서 경로 교차와 접근이 함께 예측될 때 조기 위험
  moving_conflict_enabled: false
  moving_conflict_horizon_s: 2.0
  moving_conflict_ttc_s: 3.0
  moving_conflict_lateral_ttc_s: 2.5
  moving_conflict_lateral_max_gap_y: 0.16
  moving_conflict_min_independent_speed: 0.06
  min_forward_speed: 0.05
  min_lateral_speed: 0.05
  lateral_near_y: 0.42

  # 프레임 공백과 TTC
  reset_gap_s: 0.5
  hard_reset_gap_s: 2.0
  ttc_alerts: true
  ttc_danger_s: 1.5
  ttc_caution_s: 3.0
  min_expansion_rate: 0.05
  max_motion_residual: 0.03

  # 카메라 움직임 허용 범위
  camera_max_rotation_deg: 8.0
  camera_max_translation: 0.24
  camera_max_scale_change: 0.20
  camera_motion_failure_hold_s: 0.75
  camera_motion_min_inlier_ratio: 0.30
  camera_motion_min_inlier_points: 12

  # 카메라 중·하단 배경이 2초간 거의 움직이지 않을 때 정지로 판단
  stationary_voice_enabled: true
  stationary_confirm_s: 2.0
  stationary_release_s: 0.8
  stationary_middle_top: 0.45
  stationary_lower_top: 0.70
  stationary_bottom: 0.95
  stationary_median_motion_per_s: 0.025
  stationary_p80_motion_per_s: 0.050
  stationary_scale_change_per_s: 0.030
  stationary_min_points: 12

  # 경고 유지와 출력
  release_hold_s: 0.5
  repeat_cooldown_s: 2.0
  event_match_iou: 0.3
  draw_roi: true
  review_overlay: false # 검토용 상세 오버레이
  log_jsonl: true

  # 측면 근접과 상대 진입
  side_proximity_enabled: true
  side_near_y: 0.50
  side_min_height: 0.18
  side_min_width: 0.12
  full_static_footprint: true
  relative_entry_enabled: true

  # ROI 재보정과 지면 범위 적응
  roi_recalibration_enabled: true
  roi_ground_adapt_enabled: true
  roi_top_max_y: 0.50
  roi_extent_smooth_s: 0.35
  roi_extent_hold_s: 0.50
  roi_extent_deadband: 0.015
  roi_extent_max_shift_per_s: 0.40
  label_confirm_frames: 3
  label_confidence: 0.60
  label_conflict_hold_s: 0.80

  # 넓은 ROI의 중앙·측면 위험 기준
  wide_roi_priority_enabled: true
  central_danger_left: 0.20
  central_danger_right: 0.80
  side_danger_y: 0.90
  roi_jitter_shift: 0.03
  roi_large_shift: 0.08
  roi_change_confirm_s: 0.30
  roi_small_confirm_s: 0.50
  roi_candidate_spread: 0.03

  # 보행불가 노면 위험
  surface_risk_enabled: true
  surface_confirm_s: 0.20
  surface_clear_s: 0.50
  surface_min_area: 0.003
  surface_band_fraction: 0.12
  surface_unstable_change: 0.18
  class_bridge_enabled: true
  visibility_advisory_s: 1.0
  camera_view_guard_enabled: true

  # 겹치는 경고 표시 묶음
  warning_grouping_enabled: true
  warning_group_iou: 0.65
  warning_group_containment: 0.85
  warning_group_max_area_ratio: 1.60

  # 장애물 주변 보행가능영역 확인
  walkable_surroundings_filter_enabled: true
  surrounding_side_width_ratio: 0.15
  surrounding_side_height_ratio: 0.40
  surrounding_bottom_height_ratio: 0.10
  surrounding_max_side_width_ratio: 0.02
  surrounding_max_bottom_height_ratio: 0.02
  surrounding_min_region_pixels: 4
  surrounding_walkable_threshold: 0.05

# 객체 추적
tracking:
  enabled: true
  backend: botsort
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  track_buffer: 30
  match_thresh: 0.8
  fuse_score: true
