# file_path: configs/audio.yaml
# 음성 합성·재생과 신호 안내의 시간 설정이다.

audio:
  sample_rate_hz: 16000
  bitrate_kbps: 96
  volume: 1.0
  playback_rate: 1.5
  default_validity_ms: 8000
  playback_timeout_ms: 15000
  tick_ms: 250
  crosswalk_max_age_ms: 1500
  # 신호 확정·소실과 보행 위험 안내 해제 기준은 영상·실시간에서 공유한다.
  guidance:
    stable_ms: 400
    stable_frames: 3
    max_age_ms: 1500
    missing_ms: 2000
    walking_left_max_ratio: 0.35
    walking_right_min_ratio: 0.65
    walking_center_intrusion_ratio: 0.05
    walking_side_intrusion_ratio: 0.10
    walking_voice_immediate_overlap_ratio: 0.10
    walking_distance_tie_ratio: 0.05
    # 가운데 점유율이 45~55%이면 직전 걸음 수를 유지해 안내 흔들림을 막는다.
    walking_two_step_enter_ratio: 0.55
    walking_two_step_exit_ratio: 0.45
    # 음성 행동 전환과 동일 안내 재생 기준
    walking_lateral_confirm_ms: 200
    walking_straight_confirm_ms: 1000
    walking_from_stop_confirm_ms: 500
    walking_repeat_none_ms: 3000
    walking_stop_repeat_none_ms: 500
    walking_missing_hold_ms: 800
  # 영상과 서버 응답 기반 실시간 앱의 기존 관측 허용 간격을 각각 유지한다.
  video_max_gap_ms: 1000
  realtime_max_gap_ms: 2000
