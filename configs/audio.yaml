# file_path: configs/audio.yaml
# 음성 합성·재생과 신호 안내의 시간 설정이다.

audio:
  sample_rate_hz: 16000
  bitrate_kbps: 96
  volume: 1.0
  playback_rate: 1.5
  default_validity_ms: 8000
  playback_timeout_ms: 15000
  tick_ms: 250
  crosswalk_max_age_ms: 1500
  # 신호 확정·소실과 보행 위험 안내 해제 기준은 영상·실시간에서 공유한다.
  guidance:
    stable_ms: 400
    stable_frames: 3
    max_age_ms: 1500
    missing_ms: 2000
    # 같은 대상·색상이 계속 확인되면 마지막 신호 안내 후 이 시간이 지나 다시 읽는다.
    traffic_repeat_ms: 5000
    # 횡단 중 파란 ROI의 횡단보도 근거가 이 시간보다 짧게 끊기면 확인한 신호 기억을 유지한다.
    traffic_crossing_hold_ms: 5000
    # 파란 ROI 면적 중 횡단보도 마스크가 이 비율 이상일 때만 신호 음성을 허용한다.
    traffic_crosswalk_roi_min_fraction: 0.05
    walking_left_max_ratio: 0.35
    walking_right_min_ratio: 0.65
    # 좌·중·우가 모두 위험할 때 혼잡으로 확정하는 화면 중앙 구간
    walking_crowded_center_left_ratio: 0.45
    walking_crowded_center_right_ratio: 0.55
    walking_center_intrusion_ratio: 0.05
    walking_side_intrusion_ratio: 0.10
    walking_voice_immediate_overlap_ratio: 0.10
    walking_distance_tie_ratio: 0.03
    # 위험 거리 동률 시 전체 화면 좌우 walkable 비율 차이가 이 값을 넘어야 방향을 안내한다.
    walking_walkable_side_tie_ratio: 0.05
    # 가운데 점유율이 45~55%이면 직전 걸음 수를 유지해 안내 흔들림을 막는다.
    walking_two_step_enter_ratio: 0.55
    walking_two_step_exit_ratio: 0.45
    # 음성 행동 전환과 동일 안내 재생 기준
    walking_lateral_confirm_ms: 600
    walking_from_stop_confirm_ms: 500
    walking_same_direction_repeat_ms: 4000
    # 혼잡 진입 후 방향 전환 보호 시간. 재안내가 이 시간을 연장하지 않는다.
    walking_crowded_redirect_ms: 3000
    # 위험이 지속되는 동안만 재안내하며 객체 ID 변경으로 주기를 초기화하지 않는다.
    walking_crowded_repeat_ms: 3000
    walking_repeat_none_ms: 1500
    walking_stop_repeat_none_ms: 1500
    walking_missing_hold_ms: 800
  # 영상과 서버 응답 기반 실시간 앱의 기존 관측 허용 간격을 각각 유지한다.
  video_max_gap_ms: 1000
  realtime_max_gap_ms: 2000
